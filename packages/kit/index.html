<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>lit-kit examples</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; }
      h1 { margin-bottom: 32px; }
      section { margin-bottom: 24px; border: 1px solid #ddd; border-radius: 8px; padding: 16px; }
      h2 { margin-top: 0; }
    </style>
    <script type="module" src="./examples/example-js-props.ts"></script>
    <script type="module" src="./examples/example-ts-decorators.ts"></script>
    <script type="module" src="./examples/example-controllers.ts"></script>
    <script type="module" src="./examples/example-resource.ts"></script>
    <script type="module" src="./examples/example-state.ts"></script>
  </head>
  <body>
    <h1>lit-kit Examples</h1>

    <section>
      <h2>JS Props (static block)</h2>
      <counter-card label="Clicks"></counter-card>
    </section>

    <section>
      <h2>JS Props (post-class)</h2>
      <greeting-banner name="lit-kit"></greeting-banner>
    </section>

    <section>
      <h2>TS Decorators + @watch/@bind</h2>
      <search-box></search-box>
    </section>

    <section>
      <h2>Browser Controllers (use)</h2>
      <responsive-panel></responsive-panel>
    </section>

    <section>
      <h2>Async Resource</h2>
      <user-profile></user-profile>
    </section>

    <section>
      <h2>URL &amp; Persisted State</h2>
      <state-demo></state-demo>
    </section>
  </body>
</html>
