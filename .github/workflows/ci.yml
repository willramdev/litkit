name: ci

# Read-only CI gate for litkit. Runs the green baseline (install/typecheck/
# build/test) on every push and pull request to main. No write scopes, no
# registry credentials, and no publish step — publish auth is Phase-4 release.yml.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: the workflow only needs to read repository contents.
permissions:
  contents: read

jobs:
  build-test:
    name: build-test (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test

  # Single-Node gate: exports/types packaging + changeset presence + coverage.
  # Runs once (not per matrix leg) behind a green build-test. fetch-depth: 0 so
  # `changeset status` can diff against origin/main. Inherits the top-level
  # read-only token — no credentials, no publish step.
  gate:
    name: gate
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # plain-JS ergonomics gate (TYPE-03, CR-01/WR-02). WR-02 ordering invariant:
      # this step MUST run after `npm run build` — the five js-*.js checkJs
      # consumers resolve `@willramdev/*` through each package exports map into
      # `dist/`, so they only type-check against a freshly built tree. Do NOT
      # reorder this before the build step. Runs once in the gate job (not per
      # build-test matrix leg) and needs only the top-level `contents: read`.
      - name: plain-JS ergonomics gate (checkJs smoke — TYPE-03)
        run: npm run typecheck:smoke
      # type-SemVer shape gate (TYPE-02, D-01/D-04/D-10): regenerate the committed
      # flattened public .d.ts snapshots, then fail on any drift. The committed
      # snapshot IS the baseline — no branch-vs-main fetch. Ordering invariant:
      # build -> type-snapshot -> git diff. Needs only `contents: read`.
      - name: type-snapshot (regenerate flattened public .d.ts)
        run: npm run type-snapshot
      # WR-01: a plain `git diff --exit-code` IGNORES untracked files, so a new
      # but un-baselined subpath snapshot (e.g. tools/type-snapshots/newpkg.d.ts)
      # could otherwise ship CI-green. Stage the snapshot dir first, then diff the
      # staged tree against HEAD — `git add -A` picks up untracked AND deleted
      # files, so this fails on modified, deleted, OR untracked snapshot drift
      # while still printing the human-readable diff reviewers rely on (D-03).
      # Both commands stay pathspec-scoped to tools/type-snapshots/ so unrelated
      # build output never enters the gate. Local index ops — no token (D-10).
      - name: shape gate (fail on any tracked-or-untracked snapshot drift)
        run: git add -A -- tools/type-snapshots/ && git diff --cached --exit-code -- tools/type-snapshots/
      # CEM freshness gate (Phase 9, D-06/D-12): `npm run build` above chains
      # `cem analyze` into each element package, regenerating custom-elements.json
      # + the VS Code custom-data + JetBrains web-types artifacts. Stage them first
      # (git add -A picks up untracked AND deleted files — a new package's manifest
      # can't ship CI-green un-baselined) then diff the staged tree against HEAD.
      # Same shape as the shape gate above; both commands stay pathspec-scoped to
      # the three artifact globs so unrelated build output never enters the gate.
      # LF-pinned in .gitattributes so Windows-author == Ubuntu-CI byte-for-byte.
      # Local index ops — no token; do NOT widen `permissions: contents: read`.
      - name: CEM freshness gate (fail on any manifest/editor-data drift)
        run: |
          git add -A -- 'packages/*/custom-elements.json' 'packages/*/vscode.*-custom-data.json' 'packages/*/web-types.json'
          git diff --cached --exit-code -- 'packages/*/custom-elements.json' 'packages/*/vscode.*-custom-data.json' 'packages/*/web-types.json'
      # CEM completeness gate (Phase 9, D-09): assert each manifest's generated
      # tagName set EQUALS the committed tools/cem-check/known-tags.json contract.
      # Equality catches a hollow declaration (missing real tag) AND a leaked demo
      # tag. Reads committed manifests + the known-tag file — no token needed.
      - name: CEM completeness gate (tag-set equality)
        run: node tools/cem-check/assert-tags.mjs
      # dev-warning strip + no-process sandbox (WARN-03): a real minified prod
      # consumer build must contain zero `[litkit]` strings, and importing kit's
      # dist with process unset must not throw `process is not defined`. Consumes
      # the built dist/ (runs after `npm run build` above). Read-only — no token
      # (D-09); do NOT widen the top-level `permissions: contents: read`.
      - name: dev-warning strip + no-process sandbox (WARN-03)
        run: npm run dev-warning-strip
      # publint: package.json exports/types correctness across all five packages.
      - name: publint (all packages)
        run: |
          for d in packages/*; do npx publint "$d"; done
      # attw: .d.ts resolution under node16 + bundler; esm-only profile suppresses
      # the expected CJS-resolution reports for these import-only packages.
      - name: attw --profile esm-only (all packages)
        run: |
          for d in packages/*; do npx attw --pack "$d" --profile esm-only; done
      # changeset gate: fails a package-changing PR that ships no covering changeset.
      - name: changeset status
        run: npx changeset status --since origin/main
      # v8 coverage: report-only (text + json-summary reporters), no threshold gate.
      - name: coverage (report-only)
        run: npx vitest run --coverage
      # examples app build (EXPL-01): the private examples/ workspace app consumes
      # the freshly built dist/ of all five packages through their exports maps.
      # Ordering invariant: this MUST run after `npm run build` above so dist/
      # exists. Local workspace resolution only — no registry token needed; do NOT
      # widen the top-level `permissions: contents: read`.
      - name: examples app build (EXPL-01)
        run: npm run build -w examples
      # single-instance check (EXPL-02): hard-fail if lit or any @tanstack/* peer
      # resolves to more than one (or zero) versions in the workspace tree — the
      # externalization dedup canary. Reads the resolved npm tree only; no token
      # needed; do NOT widen the top-level `permissions: contents: read`.
      - name: single-instance check (EXPL-02)
        run: node scripts/check-single-instance.mjs
